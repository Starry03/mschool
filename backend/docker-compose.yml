services:
  db:
    image: mysql:8.0
    container_name: school_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: school_db
      MYSQL_USER: school_user
      MYSQL_PASSWORD: school_pass
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "school_user", "--password=school_pass"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: school_backend
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - ./app:/backend/app
    environment:
      - MYSQL_USER=school_user
      - MYSQL_PASSWORD=school_pass
      - MYSQL_HOST=db
      - MYSQL_PORT=3306
      - MYSQL_DATABASE=school_db
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  db_data:
