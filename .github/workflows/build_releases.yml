name: Build and Release Flutter App

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build_android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: |
          cd frontend
          flutter pub get

      - name: Build APK
        run: |
          cd frontend
          flutter build apk --release

      - name: Upload Android Asset
        uses: softprops/action-gh-release@v2
        with:
          files: frontend/build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build_linux:
    name: Build Linux Desktop
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Flutter packages
        run: |
          cd frontend
          flutter pub get

      - name: Build Linux
        run: |
          cd frontend
          flutter build linux --release

      - name: Package Linux App
        run: |
          cd frontend/build/linux/x64/release
          tar -czf ../../../../mschool-linux.tar.gz bundle/

      - name: Upload Linux Asset
        uses: softprops/action-gh-release@v2
        with:
          files: mschool-linux.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build_windows:
    name: Build Windows Desktop
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Flutter packages
        run: |
          cd frontend
          flutter pub get

      - name: Build Windows
        run: |
          cd frontend
          flutter build windows --release

      - name: Package Windows App
        shell: pwsh
        run: |
          Compress-Archive -Path frontend/build/windows/x64/runner/Release/* -DestinationPath mschool-windows.zip

      - name: Upload Windows Asset
        uses: softprops/action-gh-release@v2
        with:
          files: mschool-windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build_macos_ios:
    name: Build macOS & iOS
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Flutter packages
        run: |
          cd frontend
          flutter pub get

      - name: Build macOS
        run: |
          cd frontend
          flutter build macos --release

      - name: Package macOS App
        run: |
          cd frontend/build/macos/Build/Products/Release
          zip -r ../../../../../mschool-macos.zip *.app

      - name: Build iOS (No codesign)
        run: |
          cd frontend
          flutter build ios --release --no-codesign

      - name: Package iOS Build
        run: |
          cd frontend/build/ios/iphoneos
          mkdir Payload
          cp -r Runner.app Payload/
          zip -r ../../../mschool-ios-nocodesign.ipa Payload

      - name: Upload Apple Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            mschool-macos.zip
            mschool-ios-nocodesign.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
